version: '3.8'

services:
  # 1. 프론트엔드 컨테이너
  frontend:
    image: ${DOCKER_IMAGE}:latest
    container_name: passproject-frontend
    expose:
      - "3000"
    restart: always
    networks:
      - pass-link

  # 2. Nginx 컨테이너 (SSL Gateway)
  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # [수정] 상대 경로(./)를 절대 경로(/home/ubuntu/...)로 변경
      - /home/ubuntu/certbot/conf:/etc/letsencrypt:ro
      - /home/ubuntu/certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
    restart: always
    networks:
      - pass-link

  # 3. Certbot 컨테이너 (SSL 인증서 발급 및 갱신)
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      # Nginx와 동일한 절대 경로를 바라봐야 갱신된 파일이 공유됩니다.
      - /home/ubuntu/certbot/conf:/etc/letsencrypt
      - /home/ubuntu/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - pass-link

networks:
  pass-link:
    external: true
    name: pass-network