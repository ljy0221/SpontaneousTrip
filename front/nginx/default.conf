server {
    listen 80;
    server_name dongyeop.shop www.dongyeop.shop;

    # Let's Encrypt 인증을 위한 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 모든 HTTP 요청을 HTTPS로 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name dongyeop.shop www.dongyeop.shop;

    # 인증서 경로 (발급 후 유효함)
    ssl_certificate /etc/letsencrypt/live/dongyeop.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dongyeop.shop/privkey.pem;

    location / {
        proxy_pass http://passproject-frontend:3000;
        proxy_set_header Host $host;
    }

    location /final/ {
        proxy_pass http://passproject-backend:9001/final/;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://3.37.88.46:9000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}